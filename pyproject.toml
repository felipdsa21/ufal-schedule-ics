[project]
name = "ufal-schedule-ics"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "icalendar>=7.3.0",
    "pymupdf>=1.28.2,<2",
]

[project.scripts]
ufal-schedule-ics = "ufal_schedule_ics:main"

[build-system]
requires = [ "setuptools>=61" ]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.coverage.run]
source = [ "ufal_schedule_ics" ]
branch = true

[tool.coverage.report]
fail_under = 100
show_missing = true
exclude_also = [ "raise TypeError", 'if __name__ == "__main__":' ]

[tool.ruff.format]
preview = true
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = [ "ANN", "ARG", "C4", "I", "PLW", "RUF", "S", "UP" ]
preview = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = [ "assert" ]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
